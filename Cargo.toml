[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/core",
    "crates/sql-executor",
    "crates/sql-mcp",
    "crates/sql-validator",
]

# Release build tuning:
# - release: default optimization (level 3) + thin LTO + single codegen
#   unit + stripped symbols, aimed at deployment artifacts (balancing
#   binary size and runtime performance);
# - release-fast: quickly verify release behavior during development
#   (level-1 optimization, no LTO, debug info kept), with build times far
#   below release.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = "none"
panic = "unwind"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
