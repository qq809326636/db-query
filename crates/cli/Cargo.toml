[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "excapp-db"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
excapp-db-core = { path = "../core", package = "core" }
excapp-db-sql-executor = { path = "../sql-executor", package = "sql-executor" }
excapp-db-sql-mcp = { path = "../sql-mcp", package = "sql-mcp" }
excapp-db-sql-validator = { path = "../sql-validator", package = "sql-validator" }
nix = { version = "0.29", features = ["signal"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
