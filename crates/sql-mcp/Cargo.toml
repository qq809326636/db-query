[package]
name = "sql-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "excapp_db_sql_mcp"

[dependencies]
arc-swap = "1"
excapp-db-core = { path = "../core", package = "core" }
rmcp = { version = "3.8", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
excapp-db-sql-executor = { path = "../sql-executor", package = "sql-executor" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
excapp-db-sql-validator = { path = "../sql-validator", package = "sql-validator" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"

[dev-dependencies]
# Integration-test fixture direct client (bypasses the whitelist; same shape as the sql-executor tests).
redis = { version = "1.8", features = ["tokio-comp"] }
