[app]

[app.data]
dir = "./data"  # Directory for data files

[app.log]
format = "text"  # Log output format, one of: "text", "json"
level = "info"  # Log level, one of: "error", "warn", "info", "debug", "trace"

[app.log.console]
enabled = false  # Whether to log to the console, default false
format = ""  # Console log output format, one of: "text", "json"; empty by default, using the format from [app.log]

[app.log.file]
enabled = true  # Whether to enable file logging, default true
format = "json"  # File log output format, one of: "text", "json", default json
dir = ""  # Log file directory; if empty, <app.data.dir>/logs is used
rolling = "daily"  # Log file rolling policy, one of: "daily", "hourly", "size"
rolling_max_size = 10485760  # Maximum size per log segment in bytes, default 10MB. Effective only when rolling = "size"
max_days = 7  # Maximum number of days log segments are kept

[app.mcp.streamable]
addr = "127.0.0.1"  # Streamable service listen address
port = 8000  # Streamable service listen port

# =============================================================================
# SQL validation policy (optional section; omitting it entirely = built-in
# policy)
#
# Security boundaries:
# - whitelist.kinds can only tighten: choose a subset of the built-in allow
#   set (QUERY/EXPLAIN/SHOW/DESCRIBE); kinds not listed are denied. Non
#   read-only kinds such as DML/DDL cannot be configured as allowed.
# - blacklist.function is append-only: merged with the built-in function
#   blacklist; built-in entries cannot be removed.
# - Invalid values fail fast at startup.
# =============================================================================

[validator.sql.whitelist]
# Subset of allowed statement kinds; default [] = the built-in full set.
# Allowed values: QUERY / EXPLAIN / SHOW / DESCRIBE (case-insensitive)
kinds = []

[validator.sql.pg.blacklist]
# Appended postgres function denials (valid identifier shapes, lowercased and
# deduplicated)
function = []

[validator.sql.mysql.blacklist]
# Appended mysql function denials
function = []

[validator.sql.sqlite.blacklist]
# Appended sqlite function denials
function = []

[app.databases]
watch_interval = 30  # Watch interval in seconds

[[databases]]
uid = "unique identifier; duplicates are rejected"
name = "name, for users to recognize"
description = "Brief description of the database scope, etc."
type = "postgres"
dialect = "postgres"
username = "user"
password = "password"
host = "localhost"
port = 5432
db = "app"
extra_opts = ""
