# Build the excapp-db release binary natively on Linux and macOS.
# Each target uploads its binary as a build artifact; pushing a version
# tag (v*) additionally creates a GitHub release with packaged archives.

name: build

on:
  push:
    branches: [prod]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux arm64 (native ARM runner)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macOS Apple Silicon (native)
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: excapp-db-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/excapp-db
          if-no-files-found: error

  # Runs only for version tags (v*): collects the matrix artifacts and
  # publishes them as a GitHub release. Requires the tag to point at a
  # commit already promoted to prod.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: excapp-db-*

      - name: Package release archives
        run: |
          mkdir -p release
          for dir in artifacts/excapp-db-*/; do
            target="${dir#artifacts/excapp-db-}"
            target="${target%/}"
            # upload-artifact does not preserve the executable bit
            chmod +x "${dir}excapp-db"
            tar -czf "release/excapp-db-${GITHUB_REF_NAME}-${target}.tar.gz" -C "${dir}" excapp-db
          done
          ls -l release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.tar.gz
